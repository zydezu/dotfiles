source = colors.conf

background {
    monitor = DP-1
    path = $image
    blur_passes = 3
    blur_size = 2
    hide_cursor = true
    immediate_render = true
}

background {
    monitor = DP-2
    color = rgba(000000ff)
}

label {
    monitor = DP-1
    text = <b>$TIME</b>
    font_size = 130
    font_family = Adwaita Sans
    color = rgba(255, 255, 255, 0.9)
    position = 0, 400
    halign = center
    valign = center
}

label {
    monitor = DP-1
    text = cmd[update:60000] date +"%d/%m/%Y"
    font_size = 24
    font_family = Adwaita Sans
    color = rgba(255, 255, 255, 0.7)
    position = 0, 300
    halign = center
    valign = center
}

label {
    monitor = DP-1
    text = cmd[update:300000] python3 ~/.config/hypr/weather.py
    font_size = 18
    font_family = Adwaita Sans
    color = rgba(255, 255, 255, 0.8)
    position = 0, 20
    halign = center
    valign = bottom
}

input-field {
    monitor = DP-1
    size = 300, 50
    font_family = Adwaita Sans
    outline_thickness = 1
    rounding = 0
    outer_color = $outline_variant
    inner_color = $surface_dim
    font_color = rgb(255, 255, 255)
    placeholder_text = Enter password
    caps_lock_color = $error
    check_color = rgb(100, 200, 100)
    fail_color = $error
    fail_text = Incorrect password
    position = 0, -40
    halign = center
    valign = center
}

animations {
    enabled = true

    # Define a custom curve
    bezier = snappy, 0.05, 0.9, 0.1, 1.0

    # Fade in/out of the lock screen
    animation = fadeIn, 1, 1, snappy
    animation = fadeOut, 1, 1, snappy

    # Input field animations
    animation = inputFieldDots, 1, 5, snappy
    animation = inputFieldColors, 1, 5, snappy
    animation = inputFieldFade, 1, 5, snappy
    animation = inputFieldWidth, 1, 5, snappy
}
