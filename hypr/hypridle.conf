general {
    lock_cmd = pidof hyprlock || hyprlock           # command to run on loginctl lock-session
    before_sleep_cmd = loginctl lock-session        # run before system sleeps
    after_sleep_cmd = sleep 1 && (pidof hyprlock || hyprlock)   # re-lock after waking
}

listener {
    timeout = 150                                   # 2.5min
    on-timeout = ddcutil --sleep-multiplier 0.1 setvcp 10 1 --display 1 & ddcutil --sleep-multiplier 0.1 setvcp 10 1 --display 2        # lower monitor brightness, avoid 0 with OLED monitors
    on-resume = ddcutil --sleep-multiplier 0.1 setvcp 10 100 --display 1 & ddcutil --sleep-multiplier 0.1 setvcp 10 100 --display 2     # restore monitor brightness

    # on-timeout = brightnessctl -s set 10            # lower monitor brightness, avoid 0 with OLED monitors
    # on-resume = brightnessctl -r                    # restore monitor brightness
}

listener {
    timeout = 600                                   # 10 min
    on-timeout = loginctl lock-session
}

listener {
    timeout = 900                                   # 15 min
    on-timeout = wlopm --off \*
    on-resume = wlopm --on \*
}
