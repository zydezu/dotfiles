general {
    lock_cmd = hyprlock          # command to run on loginctl lock-session
    before_sleep_cmd = hyprlock  # run before system sleeps
    after_sleep_cmd = hyprlock   # optional: re-lock after waking
}

listener {
    timeout = 600                # 10 min idle → lock
    on-timeout = hyprlock
}

listener {
    timeout = 900                # 15 min idle → screen off
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
