tab = "output"
tabs = [ "output", "input", "playback", "recording", "configuration" ]
keybindings = [
    { key = "Esc", action = "Exit" },
]

theme = "matugen"

[themes.matugen]
inherit = "default"

# Selection indicators
selector = { fg = "#68dbb0" }

# Tab styling
tab = { fg = "#b2cbd3" }
tab_selected = { fg = "#68dbb0" }
tab_marker = { fg = "#85d1e8" }

# List overflow indicators
list_more = { fg = "#7d959c" }

# Node info
node_title = { fg = "#d8e5e9" }
node_target = { fg = "#b2cbd3" }

# Volume
volume = { fg = "#d8e5e9" }
volume_empty = { fg = "#344a51" }
volume_filled = { fg = "#8bd6b5" }

# Peak meter
meter_inactive = { fg = "#344a51" }
meter_active = { fg = "#85d1e8" }
meter_overload = { fg = "#ffb4ab" }
meter_center_inactive = { fg = "#7d959c" }
meter_center_active = { fg = "#004e5e" }

# Config tab
config_device = { fg = "#d8e5e9" }
config_profile = { fg = "#8bd6b5" }

# Dropdowns
dropdown_icon = { fg = "#68dbb0" }
dropdown_border = { fg = "#7d959c" }
dropdown_item = { fg = "#d8e5e9" }
dropdown_selected = { fg = "#003828", bg = "#68dbb0" }
dropdown_more = { fg = "#7d959c" }

# Help menu
help_border = { fg = "#7d959c" }
help_item = { fg = "#b2cbd3" }
help_more = { fg = "#7d959c" }
