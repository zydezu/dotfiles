tab = "playback"
tabs = [ "playback", "output", "input", "recording", "configuration" ]
keybindings = [
    { key = "Esc", action = "Exit" },
]

theme = "matugen"

[themes.matugen]
inherit = "default"

# Selection indicators
selector = { fg = "#4fd8ea" }

# Tab styling
tab = { fg = "#bcc7dc" }
tab_selected = { fg = "#4fd8ea" }
tab_marker = { fg = "#a5c8ff" }

# List overflow indicators
list_more = { fg = "#8791a4" }

# Node info
node_title = { fg = "#dee2ef" }
node_target = { fg = "#bcc7dc" }

# Volume
volume = { fg = "#dee2ef" }
volume_empty = { fg = "#3d4758" }
volume_filled = { fg = "#81d3e0" }

# Peak meter
meter_inactive = { fg = "#3d4758" }
meter_active = { fg = "#a5c8ff" }
meter_overload = { fg = "#ffb4ab" }
meter_center_inactive = { fg = "#8791a4" }
meter_center_active = { fg = "#214876" }

# Config tab
config_device = { fg = "#dee2ef" }
config_profile = { fg = "#81d3e0" }

# Dropdowns
dropdown_icon = { fg = "#4fd8ea" }
dropdown_border = { fg = "#8791a4" }
dropdown_item = { fg = "#dee2ef" }
dropdown_selected = { fg = "#00363c", bg = "#4fd8ea" }
dropdown_more = { fg = "#8791a4" }

# Help menu
help_border = { fg = "#8791a4" }
help_item = { fg = "#bcc7dc" }
help_more = { fg = "#8791a4" }
