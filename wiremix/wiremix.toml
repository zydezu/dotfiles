tab = "output"
tabs = [ "output", "input", "playback", "recording", "configuration" ]
keybindings = [
    { key = "Esc", action = "Exit" },
]

theme = "matugen"

[themes.matugen]
inherit = "default"

# Selection indicators
selector = { fg = "#ffb59e" }

# Tab styling
tab = { fg = "#d8c4a0" }
tab_selected = { fg = "#ffb59e" }
tab_marker = { fg = "#e9c16c" }

# List overflow indicators
list_more = { fg = "#a08f6e" }

# Node info
node_title = { fg = "#efe1ca" }
node_target = { fg = "#d8c4a0" }

# Volume
volume = { fg = "#efe1ca" }
volume_empty = { fg = "#52452a" }
volume_filled = { fg = "#ffb59e" }

# Peak meter
meter_inactive = { fg = "#52452a" }
meter_active = { fg = "#e9c16c" }
meter_overload = { fg = "#ffb4ab" }
meter_center_inactive = { fg = "#a08f6e" }
meter_center_active = { fg = "#5b4300" }

# Config tab
config_device = { fg = "#efe1ca" }
config_profile = { fg = "#ffb59e" }

# Dropdowns
dropdown_icon = { fg = "#ffb59e" }
dropdown_border = { fg = "#a08f6e" }
dropdown_item = { fg = "#efe1ca" }
dropdown_selected = { fg = "#5e1800", bg = "#ffb59e" }
dropdown_more = { fg = "#a08f6e" }

# Help menu
help_border = { fg = "#a08f6e" }
help_item = { fg = "#d8c4a0" }
help_more = { fg = "#a08f6e" }
