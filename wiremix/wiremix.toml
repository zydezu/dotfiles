tab = "playback"
tabs = [ "playback", "output", "input", "recording", "configuration" ]
keybindings = [
    { key = "Esc", action = "Exit" },
]

theme = "matugen"

[themes.matugen]
inherit = "default"

# Selection indicators
selector = { fg = "#b3c5ff" }

# Tab styling
tab = { fg = "#c4c6d3" }
tab_selected = { fg = "#b3c5ff" }
tab_marker = { fg = "#d0bdf6" }

# List overflow indicators
list_more = { fg = "#8e909c" }

# Node info
node_title = { fg = "#e0e2ef" }
node_target = { fg = "#c4c6d3" }

# Volume
volume = { fg = "#e0e2ef" }
volume_empty = { fg = "#444651" }
volume_filled = { fg = "#c5c3ea" }

# Peak meter
meter_inactive = { fg = "#444651" }
meter_active = { fg = "#d0bdf6" }
meter_overload = { fg = "#ffb4ab" }
meter_center_inactive = { fg = "#8e909c" }
meter_center_active = { fg = "#4e3f6e" }

# Config tab
config_device = { fg = "#e0e2ef" }
config_profile = { fg = "#c5c3ea" }

# Dropdowns
dropdown_icon = { fg = "#b3c5ff" }
dropdown_border = { fg = "#8e909c" }
dropdown_item = { fg = "#e0e2ef" }
dropdown_selected = { fg = "#002b75", bg = "#b3c5ff" }
dropdown_more = { fg = "#8e909c" }

# Help menu
help_border = { fg = "#8e909c" }
help_item = { fg = "#c4c6d3" }
help_more = { fg = "#8e909c" }
