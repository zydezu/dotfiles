tab = "playback"
tabs = [ "playback", "output", "input", "recording", "configuration" ]
keybindings = [
    { key = "Esc", action = "Exit" },
]

theme = "matugen"

[themes.matugen]
inherit = "default"

# Selection indicators
selector = { fg = "#ffb4a2" }

# Tab styling
tab = { fg = "#dcc1ba" }
tab_selected = { fg = "#ffb4a2" }
tab_marker = { fg = "#f5bc7d" }

# List overflow indicators
list_more = { fg = "#a48b86" }

# Node info
node_title = { fg = "#f9dcd6" }
node_target = { fg = "#dcc1ba" }

# Volume
volume = { fg = "#f9dcd6" }
volume_empty = { fg = "#55423e" }
volume_filled = { fg = "#f2bb9a" }

# Peak meter
meter_inactive = { fg = "#55423e" }
meter_active = { fg = "#f5bc7d" }
meter_overload = { fg = "#ffb4ab" }
meter_center_inactive = { fg = "#a48b86" }
meter_center_active = { fg = "#653e09" }

# Config tab
config_device = { fg = "#f9dcd6" }
config_profile = { fg = "#f2bb9a" }

# Dropdowns
dropdown_icon = { fg = "#ffb4a2" }
dropdown_border = { fg = "#a48b86" }
dropdown_item = { fg = "#f9dcd6" }
dropdown_selected = { fg = "#611200", bg = "#ffb4a2" }
dropdown_more = { fg = "#a48b86" }

# Help menu
help_border = { fg = "#a48b86" }
help_item = { fg = "#dcc1ba" }
help_more = { fg = "#a48b86" }
