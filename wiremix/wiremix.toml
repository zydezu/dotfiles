tab = "output"
tabs = [ "output", "input", "playback", "recording", "configuration" ]
keybindings = [
    { key = "Esc", action = "Exit" },
]

theme = "matugen"

[themes.matugen]
inherit = "default"

# Selection indicators
selector = { fg = "#5cdbbd" }

# Tab styling
tab = { fg = "#b4cad5" }
tab_selected = { fg = "#5cdbbd" }
tab_marker = { fg = "#8ad0ef" }

# List overflow indicators
list_more = { fg = "#7e949f" }

# Node info
node_title = { fg = "#d9e4eb" }
node_target = { fg = "#b4cad5" }

# Volume
volume = { fg = "#d9e4eb" }
volume_empty = { fg = "#354a53" }
volume_filled = { fg = "#86d6bf" }

# Peak meter
meter_inactive = { fg = "#354a53" }
meter_active = { fg = "#8ad0ef" }
meter_overload = { fg = "#ffb4ab" }
meter_center_inactive = { fg = "#7e949f" }
meter_center_active = { fg = "#004d63" }

# Config tab
config_device = { fg = "#d9e4eb" }
config_profile = { fg = "#86d6bf" }

# Dropdowns
dropdown_icon = { fg = "#5cdbbd" }
dropdown_border = { fg = "#7e949f" }
dropdown_item = { fg = "#d9e4eb" }
dropdown_selected = { fg = "#00382d", bg = "#5cdbbd" }
dropdown_more = { fg = "#7e949f" }

# Help menu
help_border = { fg = "#7e949f" }
help_item = { fg = "#b4cad5" }
help_more = { fg = "#7e949f" }
