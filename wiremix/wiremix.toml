tab = "playback"
tabs = [ "playback", "output", "input", "recording", "configuration" ]
keybindings = [
    { key = "Esc", action = "Exit" },
]

theme = "matugen"

[themes.matugen]
inherit = "default"

# Selection indicators
selector = { fg = "#1ad8ff" }

# Tab styling
tab = { fg = "#bcc9cd" }
tab_selected = { fg = "#1ad8ff" }
tab_marker = { fg = "#a7c9f6" }

# List overflow indicators
list_more = { fg = "#869397" }

# Node info
node_title = { fg = "#d8e5e9" }
node_target = { fg = "#bcc9cd" }

# Volume
volume = { fg = "#d8e5e9" }
volume_empty = { fg = "#3d494d" }
volume_filled = { fg = "#a9cbe3" }

# Peak meter
meter_inactive = { fg = "#3d494d" }
meter_active = { fg = "#a7c9f6" }
meter_overload = { fg = "#ffb4ab" }
meter_center_inactive = { fg = "#869397" }
meter_center_active = { fg = "#24496e" }

# Config tab
config_device = { fg = "#d8e5e9" }
config_profile = { fg = "#a9cbe3" }

# Dropdowns
dropdown_icon = { fg = "#1ad8ff" }
dropdown_border = { fg = "#869397" }
dropdown_item = { fg = "#d8e5e9" }
dropdown_selected = { fg = "#003641", bg = "#1ad8ff" }
dropdown_more = { fg = "#869397" }

# Help menu
help_border = { fg = "#869397" }
help_item = { fg = "#bcc9cd" }
help_more = { fg = "#869397" }
