tab = "playback"
tabs = [ "playback", "output", "input", "recording", "configuration" ]
keybindings = [
    { key = "Esc", action = "Exit" },
]

theme = "matugen"

[themes.matugen]
inherit = "default"

# Selection indicators
selector = { fg = "#ffb4a8" }

# Tab styling
tab = { fg = "#dcc0bc" }
tab_selected = { fg = "#ffb4a8" }
tab_marker = { fg = "#f9ba80" }

# List overflow indicators
list_more = { fg = "#a38b87" }

# Node info
node_title = { fg = "#f9dcd8" }
node_target = { fg = "#dcc0bc" }

# Volume
volume = { fg = "#f9dcd8" }
volume_empty = { fg = "#55423f" }
volume_filled = { fg = "#f4ba9e" }

# Peak meter
meter_inactive = { fg = "#55423f" }
meter_active = { fg = "#f9ba80" }
meter_overload = { fg = "#ffb4ab" }
meter_center_inactive = { fg = "#a38b87" }
meter_center_active = { fg = "#673d0d" }

# Config tab
config_device = { fg = "#f9dcd8" }
config_profile = { fg = "#f4ba9e" }

# Dropdowns
dropdown_icon = { fg = "#ffb4a8" }
dropdown_border = { fg = "#a38b87" }
dropdown_item = { fg = "#f9dcd8" }
dropdown_selected = { fg = "#690000", bg = "#ffb4a8" }
dropdown_more = { fg = "#a38b87" }

# Help menu
help_border = { fg = "#a38b87" }
help_item = { fg = "#dcc0bc" }
help_more = { fg = "#a38b87" }
