tab = "output"
tabs = [ "output", "input", "playback", "recording", "configuration" ]
keybindings = [
    { key = "Esc", action = "Exit" },
]

theme = "matugen"

[themes.matugen]
inherit = "default"

# Selection indicators
selector = { fg = "#7ed0ff" }

# Tab styling
tab = { fg = "#c6c4dd" }
tab_selected = { fg = "#7ed0ff" }
tab_marker = { fg = "#c2c1ff" }

# List overflow indicators
list_more = { fg = "#908ea5" }

# Node info
node_title = { fg = "#e4e1ef" }
node_target = { fg = "#c6c4dd" }

# Volume
volume = { fg = "#e4e1ef" }
volume_empty = { fg = "#454559" }
volume_filled = { fg = "#90cef4" }

# Peak meter
meter_inactive = { fg = "#454559" }
meter_active = { fg = "#c2c1ff" }
meter_overload = { fg = "#ffb4ab" }
meter_center_inactive = { fg = "#908ea5" }
meter_center_active = { fg = "#414178" }

# Config tab
config_device = { fg = "#e4e1ef" }
config_profile = { fg = "#90cef4" }

# Dropdowns
dropdown_icon = { fg = "#7ed0ff" }
dropdown_border = { fg = "#908ea5" }
dropdown_item = { fg = "#e4e1ef" }
dropdown_selected = { fg = "#00344a", bg = "#7ed0ff" }
dropdown_more = { fg = "#908ea5" }

# Help menu
help_border = { fg = "#908ea5" }
help_item = { fg = "#c6c4dd" }
help_more = { fg = "#908ea5" }
