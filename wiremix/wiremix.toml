tab = "output"
tabs = [ "output", "input", "playback", "recording", "configuration" ]
keybindings = [
    { key = "Esc", action = "Exit" },
]

theme = "matugen"

[themes.matugen]
inherit = "default"

# Selection indicators
selector = { fg = "#cfcb55" }

# Tab styling
tab = { fg = "#b5ccba" }
tab_selected = { fg = "#cfcb55" }
tab_marker = { fg = "#93d5aa" }

# List overflow indicators
list_more = { fg = "#809685" }

# Node info
node_title = { fg = "#dae6da" }
node_target = { fg = "#b5ccba" }

# Volume
volume = { fg = "#dae6da" }
volume_empty = { fg = "#374b3d" }
volume_filled = { fg = "#ceca75" }

# Peak meter
meter_inactive = { fg = "#374b3d" }
meter_active = { fg = "#93d5aa" }
meter_overload = { fg = "#ffb4ab" }
meter_center_inactive = { fg = "#809685" }
meter_center_active = { fg = "#0b5131" }

# Config tab
config_device = { fg = "#dae6da" }
config_profile = { fg = "#ceca75" }

# Dropdowns
dropdown_icon = { fg = "#cfcb55" }
dropdown_border = { fg = "#809685" }
dropdown_item = { fg = "#dae6da" }
dropdown_selected = { fg = "#333200", bg = "#cfcb55" }
dropdown_more = { fg = "#809685" }

# Help menu
help_border = { fg = "#809685" }
help_item = { fg = "#b5ccba" }
help_more = { fg = "#809685" }
