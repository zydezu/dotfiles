tab = "playback"
tabs = [ "playback", "output", "input", "recording", "configuration" ]
keybindings = [
    { key = "Esc", action = "Exit" },
]

theme = "matugen"

[themes.matugen]
inherit = "default"

# Selection indicators
selector = { fg = "#6edbaa" }

# Tab styling
tab = { fg = "#b2cbd2" }
tab_selected = { fg = "#6edbaa" }
tab_marker = { fg = "#84d2e5" }

# List overflow indicators
list_more = { fg = "#7d959b" }

# Node info
node_title = { fg = "#d8e5e9" }
node_target = { fg = "#b2cbd2" }

# Volume
volume = { fg = "#d8e5e9" }
volume_empty = { fg = "#334a50" }
volume_filled = { fg = "#8ed5b1" }

# Peak meter
meter_inactive = { fg = "#334a50" }
meter_active = { fg = "#84d2e5" }
meter_overload = { fg = "#ffb4ab" }
meter_center_inactive = { fg = "#7d959b" }
meter_center_active = { fg = "#004e5b" }

# Config tab
config_device = { fg = "#d8e5e9" }
config_profile = { fg = "#8ed5b1" }

# Dropdowns
dropdown_icon = { fg = "#6edbaa" }
dropdown_border = { fg = "#7d959b" }
dropdown_item = { fg = "#d8e5e9" }
dropdown_selected = { fg = "#003825", bg = "#6edbaa" }
dropdown_more = { fg = "#7d959b" }

# Help menu
help_border = { fg = "#7d959b" }
help_item = { fg = "#b2cbd2" }
help_more = { fg = "#7d959b" }
