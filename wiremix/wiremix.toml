tab = "playback"
tabs = [ "playback", "output", "input", "recording", "configuration" ]
keybindings = [
    { key = "Esc", action = "Exit" },
]

theme = "matugen"

[themes.matugen]
inherit = "default"

# Selection indicators
selector = { fg = "#ffade2" }

# Tab styling
tab = { fg = "#e7bdb3" }
tab_selected = { fg = "#ffade2" }
tab_marker = { fg = "#ffb4a2" }

# List overflow indicators
list_more = { fg = "#ae887f" }

# Node info
node_title = { fg = "#f9dcd6" }
node_target = { fg = "#e7bdb3" }

# Volume
volume = { fg = "#f9dcd6" }
volume_empty = { fg = "#5d4038" }
volume_filled = { fg = "#f7b1de" }

# Peak meter
meter_inactive = { fg = "#5d4038" }
meter_active = { fg = "#ffb4a2" }
meter_overload = { fg = "#ffb4ab" }
meter_center_inactive = { fg = "#ae887f" }
meter_center_active = { fg = "#723425" }

# Config tab
config_device = { fg = "#f9dcd6" }
config_profile = { fg = "#f7b1de" }

# Dropdowns
dropdown_icon = { fg = "#ffade2" }
dropdown_border = { fg = "#ae887f" }
dropdown_item = { fg = "#f9dcd6" }
dropdown_selected = { fg = "#581149", bg = "#ffade2" }
dropdown_more = { fg = "#ae887f" }

# Help menu
help_border = { fg = "#ae887f" }
help_item = { fg = "#e7bdb3" }
help_more = { fg = "#ae887f" }
