tab = "playback"
tabs = [ "playback", "output", "input", "recording", "configuration" ]
keybindings = [
    { key = "Esc", action = "Exit" },
]

theme = "matugen"

[themes.matugen]
inherit = "default"

# Selection indicators
selector = { fg = "#c9beff" }

# Tab styling
tab = { fg = "#c9c4d3" }
tab_selected = { fg = "#c9beff" }
tab_marker = { fg = "#e4b8eb" }

# List overflow indicators
list_more = { fg = "#938f9c" }

# Node info
node_title = { fg = "#e6e0ef" }
node_target = { fg = "#c9c4d3" }

# Volume
volume = { fg = "#e6e0ef" }
volume_empty = { fg = "#484551" }
volume_filled = { fg = "#d3bfe6" }

# Peak meter
meter_inactive = { fg = "#484551" }
meter_active = { fg = "#e4b8eb" }
meter_overload = { fg = "#ffb4ab" }
meter_center_inactive = { fg = "#938f9c" }
meter_center_active = { fg = "#5c3a65" }

# Config tab
config_device = { fg = "#e6e0ef" }
config_profile = { fg = "#d3bfe6" }

# Dropdowns
dropdown_icon = { fg = "#c9beff" }
dropdown_border = { fg = "#938f9c" }
dropdown_item = { fg = "#e6e0ef" }
dropdown_selected = { fg = "#2f009b", bg = "#c9beff" }
dropdown_more = { fg = "#938f9c" }

# Help menu
help_border = { fg = "#938f9c" }
help_item = { fg = "#c9c4d3" }
help_more = { fg = "#938f9c" }
