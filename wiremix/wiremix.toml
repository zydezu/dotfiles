tab = "playback"
tabs = [ "playback", "output", "input", "recording", "configuration" ]
keybindings = [
    { key = "Esc", action = "Exit" },
]

theme = "matugen"

[themes.matugen]
inherit = "default"

# Selection indicators
selector = { fg = "#53d7f1" }

# Tab styling
tab = { fg = "#bec6dc" }
tab_selected = { fg = "#53d7f1" }
tab_marker = { fg = "#acc7ff" }

# List overflow indicators
list_more = { fg = "#8891a5" }

# Node info
node_title = { fg = "#dfe2ef" }
node_target = { fg = "#bec6dc" }

# Volume
volume = { fg = "#dfe2ef" }
volume_empty = { fg = "#3f4759" }
volume_filled = { fg = "#83d2e5" }

# Peak meter
meter_inactive = { fg = "#3f4759" }
meter_active = { fg = "#acc7ff" }
meter_overload = { fg = "#ffb4ab" }
meter_center_inactive = { fg = "#8891a5" }
meter_center_active = { fg = "#294677" }

# Config tab
config_device = { fg = "#dfe2ef" }
config_profile = { fg = "#83d2e5" }

# Dropdowns
dropdown_icon = { fg = "#53d7f1" }
dropdown_border = { fg = "#8891a5" }
dropdown_item = { fg = "#dfe2ef" }
dropdown_selected = { fg = "#00363f", bg = "#53d7f1" }
dropdown_more = { fg = "#8891a5" }

# Help menu
help_border = { fg = "#8891a5" }
help_item = { fg = "#bec6dc" }
help_more = { fg = "#8891a5" }
