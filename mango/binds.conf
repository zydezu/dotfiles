# Keyboard/Input
xkb_rules_layout=gb
xkb_rules_options=compose:menu

mouse_natural_scrolling=0
trackpad_natural_scrolling=1
disable_while_typing=0

mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

gesturebind=none,right,3,viewtoleft
gesturebind=none,left,3,viewtorightc
gesturebind=none,up,3,toggleoverview
gesturebind=none,down,3,toggleoverview

# System/Session
bind=SUPER+SHIFT,r,reload_config
bind=SUPER,l,spawn,loginctl lock-session
bind=SUPER+SHIFT,w,spawn,killall -SIGUSR2 waybar

# Launchers
bind=SUPER,Return,spawn,alacritty
bind=SUPER,space,spawn,rofi -modes "drun" -show "drun" -theme ~/.config/rofi/config.rasi # check https://github.com/mangowm/mango/pull/918

# Apps
bind=SUPER,b,spawn,helium-browser --enable-features=VaapiOnNvidiaGPUs,AcceleratedVideoDecodeLinuxGL,AcceleratedVideoDecodeLinuxZeroCopyGL --ignore-gpu-blocklist --ozone-platform=wayland
bind=SUPER,d,spawn,discord --enable-features=VaapiOnNvidiaGPUs,AcceleratedVideoDecodeLinuxGL,AcceleratedVideoDecodeLinuxZeroCopyGL --ignore-gpu-blocklist --ozone-platform=wayland
bind=SUPER,e,spawn,nautilus
bind=SUPER,z,spawn,zeditor

# Utilities
bind=SUPER,v,spawn,alacritty --title 'clipse' -e clipse
bind=SUPER,s,spawn,alacritty --title 'wiremix' -e wiremix
bind=SUPER,w,spawn,~/.config/mango/scripts/warptoggle.sh
bind=SUPER+SHIFT,c,spawn,~/.config/mango/scripts/colorpicker.sh
bind=CTRL+SHIFT,escape,spawn,alacritty --title 'btop' -e btop

# Capture/Kiosk
bind=SUPER+SHIFT,o,spawn,~/.config/mango/scripts/capturecardsetup.sh
bind=SUPER+SHIFT,s,spawn,bash -c 'cog --platform=x11 https://status.boysare.moe/ & sleep 0.1 && ~/.config/mango/scripts/watchkiosk.sh &'

# Dev/Scripts
bind=SUPER,y,spawn,alacritty --title 'Media Downloader' -e bash -lc "uv run --directory '/home/zy/Downloads/ytdlp' 'Auto Determine.py'"
bind=SUPER+SHIFT,y,spawn,alacritty --title 'YouTube Video Archiver' -e bash -lc "uv run --directory '/mnt/b27299bf-cb8e-44de-a901-039f69aa5feb/archive/internet/youtubepagegenerator' 'generatepage.py'"

# Screenshotting
bind=NONE,Print,spawn,~/.config/mango/scripts/screenshot.sh
bind=ALT,Print,spawn,~/.config/mango/scripts/screenshot.sh both
bind=CTRL,Print,spawn,~/.config/mango/scripts/screenshot.sh select
bind=Shift,Print,spawn,~/.config/mango/scripts/screenrecord.sh
bind=CTRL+SHIFT,Print,spawn,~/.config/mango/scripts/screenrecord.sh select

# Tags (Workspaces)
bind=SUPER,Left,viewtoleft,0
bind=SUPER,Right,viewtoright,0
bind=SUPER+CTRL,Left,tagtoleft,0
bind=SUPER+CTRL,Right,tagtoright,0

bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

bind=SUPER+CTRL,1,tag,1
bind=SUPER+CTRL,2,tag,2
bind=SUPER+CTRL,3,tag,3
bind=SUPER+CTRL,4,tag,4
bind=SUPER+CTRL,5,tag,5
bind=SUPER+CTRL,6,tag,6
bind=SUPER+CTRL,7,tag,7
bind=SUPER+CTRL,8,tag,8
bind=SUPER+CTRL,9,tag,9

bind=SUPER+CTRL+SHIFT,1,tagsilent,1
bind=SUPER+CTRL+SHIFT,2,tagsilent,2
bind=SUPER+CTRL+SHIFT,3,tagsilent,3
bind=SUPER+CTRL+SHIFT,4,tagsilent,4
bind=SUPER+CTRL+SHIFT,5,tagsilent,5
bind=SUPER+CTRL+SHIFT,6,tagsilent,6
bind=SUPER+CTRL+SHIFT,7,tagsilent,7
bind=SUPER+CTRL+SHIFT,8,tagsilent,8
bind=SUPER+CTRL+SHIFT,9,tagsilent,9

bind=SUPER+CTRL+SHIFT,Left,tagmon,left
bind=SUPER+CTRL+SHIFT,Right,tagmon,right

# Window Focus (disabled)
#bind=SUPER,Left,focusdir,left
#bind=SUPER,Right,focusdir,right
#bind=SUPER,Down,focusdir,up
#bind=SUPER,Up,focusdir,down
#bind=SUPER+SHIFT,Left,focusmon,left
#bind=SUPER+SHIFT,Right,focusmon,right

# Window Movement (disabled)
#bind=SUPER+SHIFT,Left,resizewin,-10,0
#bind=SUPER+SHIFT,Right,resizewin,+10,0

# Swap Window
bind=SUPER+SHIFT,left,exchange_client,left
bind=SUPER+SHIFT,right,exchange_client,right
bind=SUPER+SHIFT,up,exchange_client,up
bind=SUPER+SHIFT,down,exchange_client,down

# Window Management
bind=SUPER,q,killclient
bind=ALT,Tab,toggleoverview
bind=SUPER,Tab,focusstack,next
bind=SUPER,p,toggleoverlay
bind=SUPER,f,togglefloating
bind=SUPER,t,switch_layout
bind=SUPER,m,minimized
bind=SUPER+CTRL,m,restore_minimized
bind=SUPER+ALT,m,toggle_scratchpad

# Gaps
bind=ALT+SHIFT,x,incgaps,1
bind=ALT+SHIFT,z,incgaps,-1
bind=ALT+SHIFT,r,togglegaps

# Media/Volume Keys
bind=NONE,XF86AudioRaiseVolume,spawn,pactl set-sink-volume @DEFAULT_SINK@ +5%
bind=NONE,XF86AudioLowerVolume,spawn,pactl set-sink-volume @DEFAULT_SINK@ -5%
bind=NONE,XF86AudioMute,spawn,pactl set-sink-mute @DEFAULT_SINK@ toggle
bind=NONE,XF86AudioPlay,spawn,playerctl play-pause
bind=NONE,XF86AudioNext,spawn,playerctl next
bind=NONE,XF86AudioPrev,spawn,playerctl previous
bind=NONE,XF86AudioStop,spawn,playerctl stop
bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl set +5%
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl set 5%-
