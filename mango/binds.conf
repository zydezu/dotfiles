# Mouse/Gestures
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

gesturebind=none,right,3,viewtoleft
gesturebind=none,left,3,viewtoright
gesturebind=none,up,3,toggleoverview
gesturebind=none,down,3,toggleoverview

axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# System/Session
bind=SUPER+SHIFT,r,reload_config
bind=SUPER,l,spawn,loginctl lock-session
bind=SUPER+SHIFT,w,spawn,killall -SIGUSR2 waybar

# Launchers
bind=SUPER,Return,spawn,$term_bin
bind=SUPER,space,spawn,rofi -modes "drun" -show "drun" -theme ~/.config/rofi/config.rasi # check https://github.com/mangowm/mango/pull/918

# Apps
bind=SUPER,b,spawn,helium-browser --enable-features=VaapiOnNvidiaGPUs,AcceleratedVideoDecodeLinuxGL,AcceleratedVideoDecodeLinuxZeroCopyGL --ignore-gpu-blocklist --ozone-platform=wayland
bind=SUPER,d,spawn,discord
bind=SUPER,e,spawn,nautilus --new-window
bind=SUPER,z,spawn,zeditor

# Utilities
bind=SUPER,v,spawn,$term_bin --title 'clipse' -e clipse
bind=SUPER,s,spawn,$term_bin --title 'wiremix' -e wiremix
bind=SUPER,w,spawn,$script_dir/warptoggle.sh
bind=SUPER+SHIFT,c,spawn,$script_dir/colorpicker.sh
bind=CTRL+SHIFT,escape,spawn,$term_bin --title 'btop' -e btop
bind=SUPER+SHIFT,n,spawn,swaync-client --toggle-dnd

# Capture/Kiosk
bind=SUPER+SHIFT,o,spawn,$script_dir/capturecardsetup.sh
bind=SUPER+SHIFT,s,spawn,$script_dir/statuskiosk.sh
bind=SUPER+SHIFT,d,spawn,$script_dir/tplinkstatskiosk.sh
bind=SUPER+SHIFT,e,spawn,$script_dir/capturekiosk.sh

# Scripts
bind=SUPER,y,spawn,$term_bin --title 'Media Downloader' -e bash -lc "uv run --directory '/home/zy/Tools/ytdlp' 'Auto Determine.py'"
bind=SUPER+SHIFT,y,spawn,$term_bin --title 'YouTube Video Archiver' -e bash -lc "uv run --directory '/mnt/b27299bf-cb8e-44de-a901-039f69aa5feb/archive/internet/youtubepagegenerator' 'generatepage.py'"

# Screenshotting
bind=NONE,Print,spawn,$script_dir/screenshot.sh "" avif
bind=ALT,Print,spawn,$script_dir/screenshot.sh both avif
bind=CTRL,Print,spawn,$script_dir/screenshot.sh select avif
bind=Shift,Print,spawn,$script_dir/screenrecord.sh
bind=CTRL+SHIFT,Print,spawn,$script_dir/screenrecord.sh select

# Tags (Workspaces)
bind=SUPER,Left,viewtoleft,0
bind=SUPER,Right,viewtoright,0
bind=SUPER+CTRL,Left,tagtoleft,0
bind=SUPER+CTRL,Right,tagtoright,0

bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

bind=SUPER+CTRL,1,tag,1
bind=SUPER+CTRL,2,tag,2
bind=SUPER+CTRL,3,tag,3
bind=SUPER+CTRL,4,tag,4
bind=SUPER+CTRL,5,tag,5
bind=SUPER+CTRL,6,tag,6
bind=SUPER+CTRL,7,tag,7
bind=SUPER+CTRL,8,tag,8
bind=SUPER+CTRL,9,tag,9

bind=SUPER+CTRL+SHIFT,1,tagsilent,1
bind=SUPER+CTRL+SHIFT,2,tagsilent,2
bind=SUPER+CTRL+SHIFT,3,tagsilent,3
bind=SUPER+CTRL+SHIFT,4,tagsilent,4
bind=SUPER+CTRL+SHIFT,5,tagsilent,5
bind=SUPER+CTRL+SHIFT,6,tagsilent,6
bind=SUPER+CTRL+SHIFT,7,tagsilent,7
bind=SUPER+CTRL+SHIFT,8,tagsilent,8
bind=SUPER+CTRL+SHIFT,9,tagsilent,9

bind=SUPER+CTRL+SHIFT,Left,tagmon,left
bind=SUPER+CTRL+SHIFT,Right,tagmon,right

# Window Focus
bind=SUPER+SHIFT,Left,focusdir,left
bind=SUPER+SHIFT,Right,focusdir,right
#bind=SUPER,Down,focusdir,up
#bind=SUPER,Up,focusdir,down
bind=SUPER+CTRL+ALT,Left,focusmon,left
bind=SUPER+CTRL+ALT,Right,focusmon,right

# Window Movement (disabled)
#bind=SUPER+SHIFT,Left,resizewin,-10,0
#bind=SUPER+SHIFT,Right,resizewin,+10,0

# Swap Window
bind=SUPER+ALT,left,exchange_client,left
bind=SUPER+ALT,right,exchange_client,right
bind=SUPER+ALT,up,exchange_client,up
bind=SUPER+ALT,down,exchange_client,down

# Window Management
bind=SUPER,q,killclient
bind=SUPER,Tab,toggleoverview
bind=ALT,Tab,overcircle,next
bindc=SUPER,g,toggleglobal
bindc=SUPER,g,toggleoverlay
bind=SUPER,f,togglefloating
bind=SUPER,t,switch_layout
bind=SUPER,m,minimized
bind=SUPER,n,restore_minimized
bind=SUPER+ALT,m,toggle_scratchpad

# Gaps
bind=ALT+SHIFT,x,incgaps,1
bind=ALT+SHIFT,z,incgaps,-1
bind=ALT+SHIFT,r,togglegaps

# Media/Volume Keys
bind=NONE,XF86AudioRaiseVolume,spawn,pactl set-sink-volume @DEFAULT_SINK@ +5%
bind=NONE,XF86AudioLowerVolume,spawn,pactl set-sink-volume @DEFAULT_SINK@ -5%
bind=NONE,XF86AudioMute,spawn,pactl set-sink-mute @DEFAULT_SINK@ toggle
bind=NONE,XF86AudioPlay,spawn,playerctl play-pause
bind=NONE,XF86AudioNext,spawn,playerctl next
bind=NONE,XF86AudioPrev,spawn,playerctl previous
bind=NONE,XF86AudioStop,spawn,playerctl stop
bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl set +5%
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl set 5%-
