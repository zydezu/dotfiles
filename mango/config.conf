# misc
sync_obj_enable=1
sloppy_focus=0
warp_cursor=1
allow_tearing=2
auto_reload_config=1
idle_inhibit_when_fullscreen=1

# load configs
source=./vars.conf
source=./env.conf
source=./input.conf
source=./binds.conf
source=./monitor.conf
source=./visuals.conf
source=./windowrules.conf

# run autostart
exec_once = ~/.config/mango/autostart.sh

# https://github.com/mangowm/mango/issues/1043
exec_once=systemctl --user start xdg-desktop-portal.service --ignore-dependencies &
