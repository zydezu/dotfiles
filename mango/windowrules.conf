# Float by default
windowrule=isfloating:1,appid:^(.*)$

# Tiled apps
windowrule=isfloating:0,appid:zed
windowrule=isfloating:0,appid:helium
windowrule=isfloating:0,appid:md.obsidian.Obsidian
windowrule=isfloating:0,appid:com.obsproject.Studio,title:^OBS [0-9].*$

# Picture-in-picture
windowrule=isfloating:1,isoverlay:1,isglobal:1,ignore_maximize:1,ignore_minimize:1,width:410,height:232,offsetx:95,offsety:95,title:Picture-in-picture

# File dialogs/managers
windowrule=isfloating:1,width:1360,height:765,appid:org.gnome.Nautilus
windowrule=isfloating:1,width:1360,height:765,appid:org.gnome.FileRoller
windowrule=isfloating:1,width:1360,height:765,appid:xdg-desktop-portal-gtk

# TUI popups
windowrule=isfloating:1,width:650,height:800,offsetx:100,offsety:-100,animation_type_open:slide,animation_type_close:none,title:clipse,appid:Alacritty
windowrule=isfloating:1,width:720,height:800,offsetx:100,offsety:-100,animation_type_open:slide,animation_type_close:none,title:wlctl,appid:Alacritty
windowrule=isfloating:1,width:600,height:650,offsetx:100,offsety:-100,animation_type_open:slide,animation_type_close:none,title:bluetui,appid:Alacritty
windowrule=isfloating:1,width:600,height:650,offsetx:100,offsety:-100,animation_type_open:slide,animation_type_close:none,title:wiremix,appid:Alacritty
windowrule=isfloating:1,width:600,height:650,offsetx:100,offsety:-100,animation_type_open:slide,animation_type_close:none,appid:controller_viewer.py
windowrule=isfloating:1,width:650,height:800,offsetx:100,offsety:-100,title:Cog,animation_type_open:slide,animation_type_close:none
windowrule=isfloating:1,width:960,height:540,offsetx:100,offsety:-100,animation_type_open:slide,animation_type_close:none,title:video0,appid:mpv

# Video
windowrule=force_tearing:0,appid:mpv,vrr_only_fullscreen:0

# Steam/Games
windowrule=isfloating:1,appid:steam
windowrule=isfloating:0,appid:steam,title:Steam Big Picture Mode
windowrule=force_tearing:1,idleinhibit_when_focus:1,isnoanimation:1,isnoborder:1,isnoshadow:1,noblur:1,appid:^steam_app_.*$
windowrule=isopensilent:1,tags:0,isnoborder:1,isnoshadow:1,isnoanimation:1,title:^broken$,appid:^steam_app_.*$
