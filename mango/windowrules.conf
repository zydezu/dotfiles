# Float by default
window_rule=is_floating:1,app_id:^(.*)$

# Tiled apps
window_rule=is_floating:0,app_id:zed
window_rule=is_floating:0,app_id:helium
window_rule=is_floating:0,app_id:md.obsidian.Obsidian
window_rule=is_floating:0,app_id:com.obsproject.Studio,title:^OBS [0-9].*$

# Picture-in-picture
window_rule=is_floating:1,is_overlay:1,is_global:1,ignore_maximize:1,ignore_minimize:1,width:410,height:232,offset_x:95,offset_y:95,title:Picture-in-picture

# File dialogs/managers
window_rule=is_floating:1,$dlg_geom,app_id:org.gnome.Nautilus
window_rule=is_floating:1,$dlg_geom,app_id:org.gnome.FileRoller
window_rule=is_floating:1,$dlg_geom,app_id:xdg-desktop-portal-gtk

# TUI popups
window_rule=is_floating:1,$tui_tall,title:clipse,app_id:$term_appid
window_rule=is_floating:1,width:720,height:800,$tui_geom,title:wlctl,app_id:$term_appid
window_rule=is_floating:1,$tui_small,title:bluetui,app_id:$term_appid
window_rule=is_floating:1,$tui_small,title:wiremix,app_id:$term_appid
window_rule=is_floating:1,$tui_small,app_id:controller_viewer.py
window_rule=is_floating:1,$tui_tall,title:Cog
window_rule=is_floating:1,width:960,height:540,$tui_geom,title:video0,app_id:mpv

# Video
window_rule=force_tearing:0,app_id:mpv,vrr_only_fullscreen:0

# Steam/Games
window_rule=is_floating:1,app_id:steam
window_rule=is_floating:0,app_id:steam,title:Steam Big Picture Mode
window_rule=force_tearing:1,idle_inhibit_when_focus:1,no_animation:1,no_border:1,no_shadow:1,no_blur:1,app_id:^steam_app_.*$
window_rule=is_open_silent:1,tags:0,no_border:1,no_shadow:1,no_animation:1,title:^broken$,app_id:^steam_app_.*$
