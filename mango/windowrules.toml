# Video
[[rule.window_rule]]
force_tearing = 0
app_id = "mpv"
vrr_only_fullscreen = 0

# Steam/Games
[[rule.window_rule]]
is_floating = 1
app_id = "steam"

[[rule.window_rule]]
is_floating = 0
app_id = "steam"
title = "^Steam Big Picture Mode$"

[[rule.window_rule]]
idle_inhibit_when_focus = 1
no_animation = 1
no_border = 1
no_shadow = 1
no_blur = 1
app_id = "^steam_app_.*$"

[[rule.window_rule]]
idle_inhibit_when_focus = 1
no_animation = 1
no_border = 1
no_shadow = 1
no_blur = 1
