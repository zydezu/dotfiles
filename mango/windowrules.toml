# Float by default
[[rule.window_rule]]
is_floating = 1
app_id = "^(.*)$"

# Tiled apps
[[rule.window_rule]]
is_floating = 0
app_id = "zed"

[[rule.window_rule]]
is_floating = 0
app_id = "helium"

[[rule.window_rule]]
is_floating = 0
app_id = "md.obsidian.Obsidian"

[[rule.window_rule]]
is_floating = 0
app_id = "com.obsproject.Studio"
title = "^OBS [0-9].*$"

# Picture-in-picture
[[rule.window_rule]]
is_floating = 1
is_overlay = 1
is_global = 1
ignore_maximize = 1
ignore_minimize = 1
width = 410
height = 232
offset_x = 95
offset_y = 95
title = "Picture-in-picture"

# File dialogs/managers
[[rule.window_rule]]
is_floating = 1
width = 1360
height = 765
app_id = "org.gnome.Nautilus"

[[rule.window_rule]]
is_floating = 1
width = 1360
height = 765
app_id = "org.gnome.FileRoller"

[[rule.window_rule]]
is_floating = 1
width = 1360
height = 765
app_id = "xdg-desktop-portal-gtk"

# TUI popups
